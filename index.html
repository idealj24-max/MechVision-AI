<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MechVision AI — Générateur CAD 3D Industriel</title>
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js & Contrôles & Exportateur STL -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    /* Custom range slider */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #0ea5e9;
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 8px rgba(14, 165, 233, 0.8);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- 3D Viewport -->
  <div id="canvas-container"></div>

  <!-- Top Header -->
  <header class="fixed top-0 left-0 right-0 z-20 p-3 flex items-center justify-between glass-panel border-t-0 border-x-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-sky-500 flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-sky-500/30">
        M
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white leading-none">MECHVISION <span class="text-sky-400">AI</span></h1>
        <span class="text-[10px] text-slate-400 font-mono">CAD GENERATOR v1.0</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleModal('api-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-sky-400 flex items-center gap-1">
        <span>🔑 API</span>
      </button>
      <button onclick="exportSTL()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30 flex items-center gap-1">
        <span>⬇ STL</span>
      </button>
    </div>
  </header>

  <!-- Floating Status / Diagnostics Badge -->
  <div id="status-badge" class="fixed top-16 left-3 right-3 z-20 pointer-events-none flex justify-center">
    <div id="status-text" class="px-3 py-1 rounded-full bg-slate-900/90 border border-slate-700/80 text-[11px] font-mono text-sky-300 shadow-md">
      Prêt • Modèle actif : Engrenage Industriel
    </div>
  </div>

  <!-- Bottom Control Dock -->
  <div class="fixed bottom-0 left-0 right-0 z-20 glass-panel border-b-0 border-x-0 rounded-t-2xl p-4 pb-5 max-h-[52vh] overflow-y-auto">
    
    <!-- Action Bar: Camera Scan & Piece Type -->
    <div class="grid grid-cols-2 gap-2 mb-3">
      <label class="cursor-pointer flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold text-xs shadow-lg shadow-sky-600/30 transition active:scale-95">
        <span>📸 Scanner Pièce (IA)</span>
        <input type="file" id="image-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)" />
      </label>

      <select id="part-type" onchange="changePartType(this.value)" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs font-semibold text-white focus:outline-none focus:border-sky-500">
        <option value="gear">⚙️ Pignon / Engrenage</option>
        <option value="flange">🔩 Bride Hydraulique</option>
        <option value="bushing">⭕ Bague / Entretoise</option>
      </select>
    </div>

    <!-- Parametric Controls -->
    <div id="controls-panel" class="space-y-3 text-xs">
      <!-- Dynamic sliders injected by JS -->
    </div>

    <!-- Specs Readout -->
    <div class="mt-3 pt-2.5 border-t border-slate-800 flex justify-between items-center text-[11px] font-mono text-slate-400">
      <span id="dim-summary">Ø Ext: 60mm | Ép: 15mm</span>
      <span id="mat-est" class="text-sky-400">Acier C45 / PLA+</span>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-sm">
      <h2 class="text-base font-bold text-white mb-1">Configuration Gemini Vision API</h2>
      <p class="text-xs text-slate-400 mb-3">Entrez votre clé API Google Gemini pour analyser automatiquement les photos de pièces cassées.</p>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white mb-3 focus:outline-none focus:border-sky-500" />
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal('api-modal')" class="px-3 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Fermer</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded-lg bg-sky-600 text-xs font-bold text-white">Sauvegarder</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. STATE & PARAMETERS
    // ==========================================
    let currentPart = 'gear';
    let params = {
      gear: {
        teeth: 20,
        outerRadius: 30,
        boreRadius: 8,
        thickness: 14
      },
      flange: {
        outerRadius: 40,
        boreRadius: 15,
        boltCount: 6,
        boltRadius: 3,
        thickness: 10
      },
      bushing: {
        outerRadius: 25,
        boreRadius: 12,
        height: 35,
        chamfer: 2
      }
    };

    // ==========================================
    // 2. THREE.JS SCENE SETUP
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d16);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(65, 65, 85);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    // Industrial Grid
    const gridHelper = new THREE.GridHelper(160, 32, 0x0ea5e9, 0x1e293b);
    gridHelper.position.y = -15;
    scene.add(gridHelper);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight1.position.set(50, 80, 50);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.5);
    dirLight2.position.set(-50, -30, -50);
    scene.add(dirLight2);

    // Metallic Material
    const metalMaterial = new THREE.MeshStandardMaterial({
      color: 0x94a3b8,
      metalness: 0.75,
      roughness: 0.25,
    });

    let activeMesh = null;

    // ==========================================
    // 3. PARAMETRIC 3D GENERATORS
    // ==========================================
    function buildPartMesh() {
      if (activeMesh) {
        scene.remove(activeMesh);
        activeMesh.geometry.dispose();
      }

      let geometry;

      if (currentPart === 'gear') {
        const p = params.gear;
        const shape = new THREE.Shape();
        const teeth = Math.max(6, Math.round(p.teeth));
        const outerR = p.outerRadius;
        const rootR = outerR * 0.84;
        const step = (Math.PI * 2) / teeth;

        for (let i = 0; i < teeth; i++) {
          const a0 = i * step;
          const a1 = a0 + step * 0.2;
          const a2 = a0 + step * 0.35;
          const a3 = a0 + step * 0.65;
          const a4 = a0 + step * 0.8;

          const x0 = Math.cos(a0) * rootR, y0 = Math.sin(a0) * rootR;
          if (i === 0) shape.moveTo(x0, y0);
          else shape.lineTo(x0, y0);

          shape.lineTo(Math.cos(a1) * rootR, Math.sin(a1) * rootR);
          shape.lineTo(Math.cos(a2) * outerR, Math.sin(a2) * outerR);
          shape.lineTo(Math.cos(a3) * outerR, Math.sin(a3) * outerR);
          shape.lineTo(Math.cos(a4) * rootR, Math.sin(a4) * rootR);
        }
        shape.closePath();

        // Center bore hole
        if (p.boreRadius > 0 && p.boreRadius < rootR - 2) {
          const hole = new THREE.Path();
          hole.absarc(0, 0, p.boreRadius, 0, Math.PI * 2, true);
          shape.holes.push(hole);
        }

        geometry = new THREE.ExtrudeGeometry(shape, {
          depth: p.thickness,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.5,
          bevelThickness: 0.5
        });
        geometry.center();
        document.getElementById('dim-summary').innerText = `Ø Ext: ${outerR * 2}mm | Alésage: Ø${p.boreRadius * 2}mm | Z=${teeth}`;
      }

      else if (currentPart === 'flange') {
        const p = params.flange;
        const shape = new THREE.Shape();
        shape.absarc(0, 0, p.outerRadius, 0, Math.PI * 2, false);

        // Center bore
        if (p.boreRadius > 0 && p.boreRadius < p.outerRadius - 4) {
          const centerHole = new THREE.Path();
          centerHole.absarc(0, 0, p.boreRadius, 0, Math.PI * 2, true);
          shape.holes.push(centerHole);
        }

        // Bolt holes circle
        const pcd = (p.outerRadius + p.boreRadius) / 2;
        const count = Math.round(p.boltCount);
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const bx = Math.cos(angle) * pcd;
          const by = Math.sin(angle) * pcd;
          const bHole = new THREE.Path();
          bHole.absarc(bx, by, p.boltRadius, 0, Math.PI * 2, true);
          shape.holes.push(bHole);
        }

        geometry = new THREE.ExtrudeGeometry(shape, {
          depth: p.thickness,
          bevelEnabled: true,
          bevelSegments: 2,
          bevelSize: 0.6,
          bevelThickness: 0.6
        });
        geometry.center();
        document.getElementById('dim-summary').innerText = `Ø Ext: ${p.outerRadius * 2}mm | ${count} trous Ø${p.boltRadius * 2}mm`;
      }

      else if (currentPart === 'bushing') {
        const p = params.bushing;
        const shape = new THREE.Shape();
        shape.absarc(0, 0, p.outerRadius, 0, Math.PI * 2, false);

        if (p.boreRadius > 0 && p.boreRadius < p.outerRadius - 1) {
          const hole = new THREE.Path();
          hole.absarc(0, 0, p.boreRadius, 0, Math.PI * 2, true);
          shape.holes.push(hole);
        }

        geometry = new THREE.ExtrudeGeometry(shape, {
          depth: p.height,
          bevelEnabled: true,
          bevelSegments: 3,
          bevelSize: p.chamfer,
          bevelThickness: p.chamfer
        });
        geometry.center();
        document.getElementById('dim-summary').innerText = `Ø Ext: ${p.outerRadius * 2}mm | H: ${p.height}mm`;
      }

      activeMesh = new THREE.Mesh(geometry, metalMaterial);
      activeMesh.rotation.x = -Math.PI / 2;
      scene.add(activeMesh);
    }

    // ==========================================
    // 4. DYNAMIC UI SLIDERS
    // ==========================================
    function renderSliders() {
      const panel = document.getElementById('controls-panel');
      panel.innerHTML = '';

      const configs = {
        gear: [
          { key: 'teeth', label: 'Nombre de dents (Z)', min: 8, max: 60, step: 1, unit: '' },
          { key: 'outerRadius', label: 'Rayon extérieur', min: 15, max: 70, step: 1, unit: 'mm' },
          { key: 'boreRadius', label: 'Rayon alésage central', min: 2, max: 35, step: 1, unit: 'mm' },
          { key: 'thickness', label: 'Épaisseur', min: 4, max: 40, step: 1, unit: 'mm' }
        ],
        flange: [
          { key: 'outerRadius', label: 'Rayon bride', min: 20, max: 80, step: 1, unit: 'mm' },
          { key: 'boreRadius', label: 'Alésage central', min: 5, max: 45, step: 1, unit: 'mm' },
          { key: 'boltCount', label: 'Nombre de perçages', min: 3, max: 12, step: 1, unit: '' },
          { key: 'thickness', label: 'Épaisseur', min: 4, max: 30, step: 1, unit: 'mm' }
        ],
        bushing: [
          { key: 'outerRadius', label: 'Rayon extérieur', min: 10, max: 60, step: 1, unit: 'mm' },
          { key: 'boreRadius', label: 'Rayon intérieur', min: 3, max: 40, step: 1, unit: 'mm' },
          { key: 'height', label: 'Hauteur totale', min: 10, max: 90, step: 1, unit: 'mm' }
        ]
      };

      configs[currentPart].forEach(cfg => {
        const val = params[currentPart][cfg.key];
        const row = document.createElement('div');
        row.innerHTML = `
          <div class="flex justify-between mb-1">
            <span class="text-slate-300 font-medium">${cfg.label}</span>
            <span id="val-${cfg.key}" class="font-mono text-sky-400 font-bold">${val}${cfg.unit}</span>
          </div>
          <input type="range" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}" value="${val}"
            oninput="updateParam('${cfg.key}', this.value, '${cfg.unit}')" class="w-full" />
        `;
        panel.appendChild(row);
      });
    }

    function updateParam(key, value, unit) {
      params[currentPart][key] = parseFloat(value);
      document.getElementById(`val-${key}`).innerText = `${value}${unit}`;
      buildPartMesh();
    }

    function changePartType(type) {
      currentPart = type;
      renderSliders();
      buildPartMesh();
      setStatus(`Mode manuel : ${type.toUpperCase()}`);
    }

    // ==========================================
    // 5. GEMINI VISION INTEGRATION
    // ==========================================
    function setStatus(msg, isAlert = false) {
      const el = document.getElementById('status-text');
      el.innerText = msg;
      el.className = isAlert
        ? "px-3 py-1 rounded-full bg-amber-950/90 border border-amber-500 text-[11px] font-mono text-amber-300 shadow-md"
        : "px-3 py-1 rounded-full bg-slate-900/90 border border-slate-700/80 text-[11px] font-mono text-sky-300 shadow-md";
    }

    function toggleModal(id) {
      const m = document.getElementById(id);
      if (m.classList.contains('hidden')) {
        m.classList.remove('hidden');
        m.classList.add('flex');
        document.getElementById('gemini-key-input').value = localStorage.getItem('GEMINI_API_KEY') || '';
      } else {
        m.classList.add('hidden');
        m.classList.remove('flex');
      }
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-key-input').value.trim();
      localStorage.setItem('GEMINI_API_KEY', key);
      toggleModal('api-modal');
      setStatus("Clé API enregistrée ✓");
    }

    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        setStatus("⚠️ Configurez d'abord votre clé API Gemini", true);
        toggleModal('api-modal');
        return;
      }

      setStatus("⏳ Analyse IA de la pièce en cours...");

      const reader = new FileReader();
      reader.onload = async function () {
        const base64Data = reader.result.split(',')[1];
        const mimeType = file.type;

        const prompt = `Tu es un ingénieur expert en rétro-ingénierie mécanique. Analyse cette photo d'une pièce mécanique et retourne UNIQUEMENT un objet JSON valide (sans markdown) correspondant à l'un de ces 3 modèles :
1. {"type": "gear", "teeth": <nombre entier entre 8 et 60>, "outerRadius": <nombre entre 15 et 70>, "boreRadius": <nombre entre 2 et 35>, "thickness": <nombre entre 4 et 40>}
2. {"type": "flange", "outerRadius": <nombre entre 20 et 80>, "boreRadius": <nombre entre 5 et 45>, "boltCount": <entier entre 3 et 12>, "boltRadius": 3, "thickness": <nombre entre 4 et 30>}
3. {"type": "bushing", "outerRadius": <nombre entre 10 et 60>, "boreRadius": <nombre entre 3 et 40>, "height": <nombre entre 10 et 90>, "chamfer": 2}`;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  { inline_data: { mime_type: mimeType, data: base64Data } }
                ]
              }]
            })
          });

          const data = await response.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          const cleanJson = rawText.replace(/```json|```/g, '').trim();
          const parsed = JSON.parse(cleanJson);

          if (parsed && parsed.type && params[parsed.type]) {
            currentPart = parsed.type;
            document.getElementById('part-type').value = currentPart;
            Object.assign(params[currentPart], parsed);
            renderSliders();
            buildPartMesh();
            setStatus(`✅ Pièce détectée : ${currentPart.toUpperCase()} générée en 3D`);
          } else {
            throw new Error("Format non reconnu");
          }
        } catch (err) {
          console.error(err);
          setStatus("❌ Erreur d'analyse IA (vérifiez la clé API)", true);
        }
      };
      reader.readAsDataURL(file);
    }

    // ==========================================
    // 6. EXPORT STL (3D PRINTING / CAD READY)
    // ==========================================
    function exportSTL() {
      if (!activeMesh) return;
      const exporter = new THREE.STLExporter();
      const stlString = exporter.parse(activeMesh);
      const blob = new Blob([stlString], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `mechvision_${currentPart}_${Date.now()}.stl`;
      link.click();
      setStatus(`📦 Fichier STL exporté avec succès !`);
    }

    // ==========================================
    // 7. ANIMATION LOOP & RESIZE
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Init
    renderSliders();
    buildPartMesh();
    animate();
  </script>
</body>
</html>
